services:

  # ==========================================================
  # BASE DE DATOS POSTGRESQL
  # ==========================================================
  postgres:
    image: postgres:15-alpine
    container_name: cachalot-postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cachalot_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ==========================================================
  # API BACKEND NESTJS (ENCAPSULADA EN app/backend)
  # ==========================================================
  api:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-cachalotlab-nest:latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-cachalot_db}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    deploy:
      replicas: ${API_REPLICAS:-2}
    networks:
      - backend

  # ==========================================================
  # FRONTEND REACT (ENCAPSULADO EN app/frontend)
  # ==========================================================
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    image: cachalotlab-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend

  # ==========================================================
  # NGINX - PROXY REVERSO Y BALANCEADOR DE CARGA
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: cachalot-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
